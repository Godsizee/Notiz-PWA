name: CI & Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME must be lowercase for GHCR
  IMAGE_NAME: godsizee/notiz-pwa

jobs:
  # Statische Pruefung. Vorher lief nur der Build — ein Typ- oder Lint-Fehler
  # fiel damit erst beim Docker-Build auf, also nach dem Push.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  build-and-push:
    # Nur bauen, wenn die Pruefung durch ist, und nur auf master —
    # Pull Requests laufen bis 'verify' und pushen kein Image.
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Kein separater 'npm run build' mehr: das Dockerfile baut die App
      # ohnehin in seiner builder-Stage. Der vorgelagerte Build wurde komplett
      # verworfen und hat nur Laufzeit gekostet.
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* wird zur Buildzeit ins Client-Bundle eingebacken und
          # muss deshalb hier ankommen, nicht erst als Laufzeit-Env.
          build-args: |
            NEXT_PUBLIC_POCKETBASE_URL=${{ vars.NEXT_PUBLIC_POCKETBASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
