# Werte kommen aus .env (cp .env.example .env). Die :?-Syntax laesst
# `docker compose up` mit der genannten Meldung abbrechen, wenn eine Variable
# fehlt — vorher standen hier echte Zugangsdaten als Default im Klartext, in
# einem oeffentlichen Repository.
services:
  notiz-app:
    image: ghcr.io/godsizee/notiz-pwa:master
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_POCKETBASE_URL=${NEXT_PUBLIC_POCKETBASE_URL:?in .env setzen, siehe .env.example}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:?in .env setzen, siehe .env.example}
      - POCKETBASE_URL=${POCKETBASE_URL:-http://pocketbase:8090}
      # Kommagetrennte Allowlist fuer /api/register. Leer oder nicht gesetzt =
      # Registrierung zu; Konten legt man dann im PocketBase-Admin an.
      - REGISTRATION_ALLOWED_EMAILS=${REGISTRATION_ALLOWED_EMAILS:-}
    depends_on:
      - pocketbase
    restart: always

  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    ports:
      - "8090:8090"
    environment:
      - PB_SUPERUSER_EMAIL=${PB_SUPERUSER_EMAIL:?in .env setzen, siehe .env.example}
      - PB_SUPERUSER_PASSWORD=${PB_SUPERUSER_PASSWORD:?in .env setzen, siehe .env.example}
    volumes:
      - pb_data:/pb_data
      - pb_public:/pb_public
    restart: always

volumes:
  pb_data:
  pb_public:
