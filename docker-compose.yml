version: "3.8"

services:
  notiz-app:
    image: ghcr.io/godsizee/notiz-pwa:master
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_POCKETBASE_URL=${NEXT_PUBLIC_POCKETBASE_URL:-https://pb.dasdann.jetzt}
      - POCKETBASE_URL=${POCKETBASE_URL:-http://pocketbase:8090}
    depends_on:
      - pocketbase
    restart: always

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    ports:
      - "8090:8090"
    environment:
      - PB_SUPERUSER_EMAIL=admin@notiz.local
      - PB_SUPERUSER_PASSWORD=AdminPassword123!
    volumes:
      - pb_data:/pb_data
      - pb_public:/pb_public
      - ./pb_migrations:/pb_migrations
    command: ["serve", "--http=0.0.0.0:8090"]
    restart: always

volumes:
  pb_data:
  pb_public:
